<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FITCS - Student Query Form</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="page">

    <div class="container">

        <div class="header">

            <div class="logo">
                FITCS
            </div>

            <div>
                <h1>FITCS - Student Query Form</h1>

                <p>
                    Submit your query
                </p>
            </div>

        </div>


        <form id="queryForm">

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Enrollment Number
                    </label>

                    <input
                        type="text"
                        id="enrollmentNo"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="studentName"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Program
                    </label>

                    <select id="program" required>

                        <option value="">
                            Select Program
                        </option>

                        <option>BCA</option>
                        <option>BCA (Hons)</option>
                        <option>B.Sc. IT</option>
                        <option>B.Sc. IT (Hons)</option>
                        <option>IMCA</option>
                        <option>MCA</option>
                        <option>M.Sc. IT</option>
                        <option>M.Sc. Data Science</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Semester
                    </label>

                    <select id="semester" required>

                        <option value="">
                            Select Semester
                        </option>

                        <option>Semester 1</option>
                        <option>Semester 2</option>
                        <option>Semester 3</option>
                        <option>Semester 4</option>
                        <option>Semester 5</option>
                        <option>Semester 6</option>
                        <option>Semester 7</option>
                        <option>Semester 8</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Query Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option>Attendance</option>
                        <option>Academic</option>
                        <option>Examination</option>
                        <option>Timetable</option>
                        <option>Fees</option>
                        <option>Mentoring</option>
                        <option>MIS / PUMIS</option>
                        <option>Scholarship</option>
                        <option>Certificate</option>
                        <option>Other</option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label>
                    Your Query
                </label>

                <textarea
                    id="query"
                    rows="6"
                    maxlength="1000"
                    placeholder="Please describe your query..."
                    required
                ></textarea>

                <div class="counter">
                    <span id="counter">0</span>/1000
                </div>

            </div>


            <button
                type="submit"
                id="submitButton"
            >
                Submit Query
            </button>

        </form>


        <div
            id="message"
            class="message"
        ></div>


        <div class="footer">

            Student Query Management System - Developed by - Hardik Parmar & Rinkal Sarvaiya

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
